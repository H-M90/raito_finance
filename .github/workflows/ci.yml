name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: raito_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, zip, gd, xml
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer manifest
        run: composer validate

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install and build static assets
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build

      - name: Configure test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          printf '\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=raito_test\nDB_USERNAME=root\nDB_PASSWORD=root\n' >> .env

      - name: Migrate and seed
        run: php artisan migrate --seed --force

      - name: Compile framework metadata and views
        run: |
          php artisan route:list >/dev/null
          php artisan config:cache
          php artisan view:cache

      - name: Run tests
        run: php artisan test

      - name: Run project checks
        run: ./check-project.sh

      - name: Upload generated Composer lockfile
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
          if-no-files-found: error
